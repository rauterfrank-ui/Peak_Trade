# ATLAS_AUTHORITY=NONE
# SCHEMA is not automatically DATA_CONTRACT, dataclass, CONFIG, or PROTOCOL.
schemas:
  - id: SCHEMA:gfu_snapshot_v1
    kind: SCHEMA
    name: governed_futures_universe_snapshot.v1
    schema_kind: evidence_snapshot_serialization
    source: src/ops/governed_futures_universe_producer_v1/constants_v1.py
    definition: SCHEMA_VERSION string enforced on GovernedFuturesUniverseSnapshotV1 persistence/load
    fields:
      - schema_version
      - instruments
    field_types: OPEN
    required_fields: OPEN
    optional_fields: OPEN
    validation: persistence_v1 expected_schema_version mismatch fail-closed
    producers:
      - CAPABILITY:cap_2_1_gfu
      - SCRIPT:run_gfu_producer
    consumers:
      - UNIVERSE:governed_futures_universe
      - CAPABILITY:cap_2_2_ranking
    serialization: json
    versioning: suffix .v1 in SCHEMA_VERSION constant
    migration: OPEN
    related_contracts:
      - DATA_CONTRACT:governed_universe_instrument_v1
    related_entities:
      - UNIVERSE:governed_futures_universe
    epistemic_class: FORENSIC_RAW
    current_canonical: false
    current_status: CURRENT_NONCANONICAL
    evidence_sources:
      - src/ops/governed_futures_universe_producer_v1/constants_v1.py
      - src/ops/governed_futures_universe_producer_v1/persistence_v1.py
      - src/ops/governed_futures_universe_producer_v1/models_v1.py

