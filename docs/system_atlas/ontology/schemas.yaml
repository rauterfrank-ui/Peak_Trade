- id: SCHEMA:bound_instrument_dataclass_v1
  kind: SCHEMA
  name: BoundInstrumentV1 dataclass shape
  schema_kind: python_dataclass_implicit_schema
  source: src/ops/single_selected_future_runtime_binding_v1/models_v1.py
  definition: Frozen dataclass fields instrument_id, venue_native_id, ranking_snapshot_id, ranking_policy_version, ranking_integrity_digest,
    ranking_order_witness_digest, universe_snapshot_id, selection_id, selection_integrity_digest, selection_state, selected_future_count,
    max_positions_effective
  fields:
  - instrument_id
  - venue_native_id
  - ranking_snapshot_id
  - ranking_policy_version
  - ranking_integrity_digest
  - ranking_order_witness_digest
  - universe_snapshot_id
  - selection_id
  - selection_integrity_digest
  - selection_state
  - selected_future_count
  - max_positions_effective
  related_contracts:
  - DATA_CONTRACT:bound_instrument_v1
  epistemic_class: FORENSIC_RAW
  current_canonical: false
  current_status: CURRENT_NONCANONICAL
  modified_by: B08_CAP23_INTEGRATION_AND_ANTI_CHURN_PROOF_V1
  evidence_sources:
  - src/ops/single_selected_future_runtime_binding_v1/models_v1.py
  notes: Implicit schema enforced by dataclass + to_dict. Distinct from SCHEMA:runtime_binding_v1 version string. B08 fields
    witness the upstream Cap 2.2 order/provenance consumed by Cap 2.3; they do not authorize Cap 2.4 reranking or reselection.
