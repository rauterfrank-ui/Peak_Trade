# ATLAS_AUTHORITY=NONE
# DoD is a first-class completion contract. Not collapsed into tests or Capability Closure Standard.
dods:
  - id: DOD:program_final
    kind: DOD
    name: Program Definition of Done
    scope: program
    subject: Peak_Trade no-order system finish program
    criteria: FINAL_PROGRAM_DOD_REQUIRED_STATE block including DOCUMENTATION_RUNTIME_DRIFT=false, SINGLE_SELECTED_FUTURE_RUNTIME_CLOSED, C1/C2/C3 productively bound, Master V2 reachable, Double Play unambiguous, LIVE not implied
    authority: canonical_master_runbook_section_21
    source: docs/runbooks/canonical/PEAK_TRADE_MASTER_RUNBOOK.md
    consumers:
      - RUNBOOK:canonical_master_runbook
    validators: []
    tests: []
    related_invariants: []
    related_gates:
      - GATE:live_authorized_false
    related_predicates: []
    epistemic_class: CANONICAL_AUTHORITY
    current_canonical: true
    current_status: CURRENT_CANONICAL
    temporal_class: CURRENT
    authority_sources:
      - docs/runbooks/canonical/PEAK_TRADE_MASTER_RUNBOOK.md
    evidence_sources:
      - docs/runbooks/canonical/PEAK_TRADE_MASTER_RUNBOOK.md
    notes: Named "Program Definition of Done" in §21. Distinct from §11 Mandatory Capability Closure Standard.

  - id: DOD:capability_closure_standard
    kind: DOD
    name: Mandatory Capability Closure Standard
    scope: capability
    subject: Every capability specification
    criteria: CAPABILITY_ID, TITLE, OWNER_REQUIREMENT, CURRENT_STATE, TARGET_STATE, SAFETY_INVARIANTS, TEST_PLAN, EVIDENCE_PLAN, ACTIVATION_STATE, and remaining §11 required fields
    authority: canonical_master_runbook_section_11
    source: docs/runbooks/canonical/PEAK_TRADE_MASTER_RUNBOOK.md
    consumers:
      - CAPABILITY:cap_2_1_gfu
      - CAPABILITY:cap_2_3_single_selected_future
    validators: []
    tests: []
    epistemic_class: CANONICAL_AUTHORITY
    current_canonical: true
    current_status: CURRENT_CANONICAL
    temporal_class: CURRENT
    authority_sources:
      - docs/runbooks/canonical/PEAK_TRADE_MASTER_RUNBOOK.md
    evidence_sources:
      - docs/runbooks/canonical/PEAK_TRADE_MASTER_RUNBOOK.md
    notes: Related to DoD but not named DoD. Recorded here so the collision is visible, not collapsed.

