# ATLAS_AUTHORITY=NONE
# RECONCILIATION_AUTHORITY=NONE
schema_version: peak_trade.reconciliation_governance.v1
description: >
  Field catalog for ledger records. Empty ledger remains schema-valid.
  Categories remain epistemically separate. Census artifact files listed
  below are evidence, not a second authority.
identity:
  - reconciliation_id
  - canonical_record_name
  - historical_names
  - aliases
discovery:
  - discovery_status
  - current_presence
  - discovered_from
  - discovery_evidence
  - first_bound_ref
  - historical_paths
  - historical_refs
  - historical_commits
understanding:
  - purpose_understood
  - purpose_statement
  - historical_problem_statement
  - inputs
  - outputs
  - dependencies
  - consumers
  - authority_role
  - safety_role
  - runtime_role
  - invariants
relations:
  - relation_type
  - target_id
  - unresolved_target
  - evidence
  - epistemic_status
current_comparison:
  - current_equivalent
  - current_paths
  - capability_overlap
  - semantic_compatibility
  - authority_compatibility
  - safety_compatibility
  - runtime_compatibility
  - conflicts
  - gaps
adjudication:
  - lifecycle_state
  - disposition
  - positive_reason
  - evidence_refs
  - contradictions
  - unresolved_questions
integration:
  - reintegration_required
  - adaptation_required
  - implementation_status
  - implementation_refs
audit:
  - created_from_evidence
  - last_adjudicated_against_sha
  - notes
allowed_current_presence:
  - CURRENTLY_PRESENT
  - CURRENTLY_ABSENT
  - CURRENTLY_PARTIAL
  - CURRENT_IDENTITY_UNRESOLVED
allowed_relation_types:
  - POSSIBLE_SAME_AS
  - DEPENDS_ON
  - SUPERSEDES
  - REPLACED_BY
  - CONSUMED_BY
  - IMPLEMENTS
  - CONFLICTS_WITH
  - COVERED_BY
  - PRODUCES_FOR
  - CONSUMES_FROM
  - WRAPS
  - ORCHESTRATES
  - GATES
  - SELECTS
  - BINDS
  - CALLS
  - DERIVES_FROM
  - RENAMED_TO
  - SPLIT_INTO
  - MERGED_INTO
census_artifact_files:
  - search_surfaces.yaml
  - coverage.yaml
  - discovery_candidates.yaml
  - relations.yaml
current_presence_is_not_disposition: true
current_presence_is_not_current_system_comparison: true
