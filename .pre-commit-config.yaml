# Peak_Trade: minimal, noise-proof hooks (EOF / whitespace / line endings) + optional Ruff
#
# Update hooks occasionally:
#   uv run pre-commit autoupdate
#   uv run pre-commit run --all-files

exclude: |
  (?x)^(
    \.git/|
    \.venv/|
    \.mypy_cache/|
    \.pytest_cache/|
    \.ruff_cache/|
    build/|
    dist/|
    site/|
    reports/|
    .*__pycache__/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # KILLER FEATURE: verhindert "new blank line at EOF" Noise zuverlässig.
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            forensic/post_step32_knowledge_integration_v0/evidence/raw_verbatim_identity_copies_authority_none/(desktop|transcripts)/.*|
            forensic/lossless_structural_projection_v2_v2_1_pack_v1/evidence/raw_verbatim_identity_copies_authority_none/.*|
            forensic/lossless_structural_projection_v2_v2_1_pack_v1/generator/.*|
            forensic/p6_proven_relevant_jsonl_identity_copies_v1/evidence/raw_verbatim_identity_copies_authority_none/.*|
            forensic/evidence/sha256-a5a468f761e24e17fc0402dbf056df7d45090b3c58f0e9a2ad469569e908e212/PEAK_TRADE_TEMPORARY_FORENSIC_WORKING_RUNBOOK\.md
          )$

      # Trim trailing whitespace; behält Markdown-Linebreaks ("two spaces") bei.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md, --markdown-linebreak-ext=markdown]
        exclude: |
          (?x)^(
            forensic/post_step32_knowledge_integration_v0/evidence/raw_verbatim_identity_copies_authority_none/(desktop|transcripts)/.*|
            forensic/lossless_structural_projection_v2_v2_1_pack_v1/evidence/raw_verbatim_identity_copies_authority_none/.*|
            forensic/lossless_structural_projection_v2_v2_1_pack_v1/generator/.*|
            forensic/p6_proven_relevant_jsonl_identity_copies_v1/evidence/raw_verbatim_identity_copies_authority_none/.*|
            forensic/evidence/sha256-a5a468f761e24e17fc0402dbf056df7d45090b3c58f0e9a2ad469569e908e212/PEAK_TRADE_TEMPORARY_FORENSIC_WORKING_RUNBOOK\.md
          )$

      # Einheitliche Line Endings (LF) erzwingen.
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: |
          (?x)^(
            forensic/post_step32_knowledge_integration_v0/evidence/raw_verbatim_identity_copies_authority_none/(desktop|transcripts)/.*|
            forensic/lossless_structural_projection_v2_v2_1_pack_v1/evidence/raw_verbatim_identity_copies_authority_none/.*|
            forensic/lossless_structural_projection_v2_v2_1_pack_v1/generator/.*|
            forensic/p6_proven_relevant_jsonl_identity_copies_v1/evidence/raw_verbatim_identity_copies_authority_none/.*|
            forensic/evidence/sha256-a5a468f761e24e17fc0402dbf056df7d45090b3c58f0e9a2ad469569e908e212/PEAK_TRADE_TEMPORARY_FORENSIC_WORKING_RUNBOOK\.md
          )$

      # Kleiner Safety-Net-Stack (low noise, high value)
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: |
          (?x)^(
            forensic/lossless_structural_projection_v2_v2_1_pack_v1/evidence/raw_verbatim_identity_copies_authority_none/PEAK_TRADE_TEMPORARY_FORENSIC_WORKING_RUNBOOK\.md|
            forensic/evidence/sha256-a5a468f761e24e17fc0402dbf056df7d45090b3c58f0e9a2ad469569e908e212/PEAK_TRADE_TEMPORARY_FORENSIC_WORKING_RUNBOOK\.md
          )$

  # Ruff for linting (kept)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: |
          (?x)^(forensic/lossless_structural_projection_v2_v2_1_pack_v1/generator/peak_trade_v21_gen\.py|forensic/lossless_working_runbook_structure_identity_method_v1/build_lossless_structure\.py)$

  # Black for formatting (matches CI audit) - DISABLED: conflicts with ruff format
  # See: https://docs.astral.sh/ruff/formatter/#black-compatibility
  # - repo: https://github.com/psf/black-pre-commit-mirror
  #   rev: 24.10.0
  #   hooks:
  #     - id: black

  # Local repository hooks (custom scripts)
  - repo: local
    hooks:
      # CI Required Contexts Contract Guard
      # Validates that CI workflow follows the matrix naming contract.
      # Prevents PRs from being blocked by missing required check contexts.
      # Only runs when CI workflow or guard script is modified.
      - id: ci-required-contexts-contract
        name: CI Required Contexts Contract (matrix required checks)
        entry: scripts/ops/check_required_ci_contexts_present.sh
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/ci\.yml|scripts/ops/check_required_ci_contexts_present\.sh)$
