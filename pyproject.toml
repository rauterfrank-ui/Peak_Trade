[build-system]
requires = ["setuptools>=61.0", "wheel>=0.38.1"]
build-backend = "setuptools.build_meta"

[project]
name = "peak_trade"
version = "0.1.0"
description = "Modulares Trading- und Backtest-Framework für Krypto-Strategien."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Frank Rauter"}
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "prometheus-client>=0.19.0",
    "toml>=0.10.2",
    "pyarrow>=23.0.1",
    "urllib3>=2.7.0,<3",
]

[project.optional-dependencies]
kraken = [
    "ccxt>=4",
]
dev = [
    "optuna>=3.0,<4",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx",  # Required by FastAPI TestClient in tests
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pyright>=1.1.380",
    "mypy>=1.10",
    "tomli; python_version < \"3.11\"",
]
test = [
    "tomli; python_version < \"3.11\"",
]
web = [
    "fastapi>=0.135.1",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.0",
    "httpx>=0.25.0",  # Required by FastAPI TestClient
    "prometheus-client>=0.19.0",
]
webui_browser = [
    "playwright>=1.40.0",  # Chrome-primary dashboard evidence harness (channel=chrome)
]
viz = [
    "matplotlib>=3.8.0",
]
otel = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
]
knowledge = [
    "chromadb>=0.4.0",
]
monitoring = [
    "prometheus-client>=0.19.0",
]
tracking = [
    "mlflow>=3.9,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# pytest config is in pytest.ini for better compatibility with warning filters

[tool.ruff]
line-length = 100
target-version = "py310"
# Exact-file exclude only. Operator-verify runs `ruff check .` and must not rewrite this
# preserved forensic generator. Do not widen to forensic/ or other generators.
extend-exclude = [
    "forensic/lossless_working_runbook_structure_identity_method_v1/build_lossless_structure.py",
]

[tool.ruff.lint]
# Conservative gate to avoid legacy churn
# E = pycodestyle errors, F = pyflakes
select = ["E", "F"]
ignore = [
    "E402",  # module level import not at top of file
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name (legacy code uses short names)
    "F401",  # imported but unused (many __init__.py re-exports)
    "F402",  # import shadowed by loop variable
    "F541",  # f-string without placeholders (many in legacy code)
    "F811",  # redefinition of unused name
    "F821",  # undefined name (forward references, type hints)
    "F841",  # local variable assigned but never used
]

[tool.ruff.lint.per-file-ignores]
# Tests may have unusual patterns
"tests/**/*.py" = ["F811", "F821"]
# Scripts may have different import patterns
"scripts/**/*.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.uv]
# Pre-Live DEPENDENCY_AUDIT HIGH remediation (RB-01/RB-02): floor vulnerable packages.
# requires-python>=3.10 is mandatory because urllib3/pyarrow/msgpack/starlette fixes require it.
constraint-dependencies = [
    "msgpack>=1.2.1",
    "starlette>=1.3.1",
]

[dependency-groups]
dev = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pip-audit>=2.9.0",
    "pre-commit>=4.3.0",
    "prometheus-client>=0.23.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]
