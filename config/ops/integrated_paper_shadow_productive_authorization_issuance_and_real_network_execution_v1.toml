# Successor to PR #5591 / #5592. Provides productive issuance and real public MD
# transport. Repository defaults do NOT authorize a session. No Orders/Testnet/Live/
# Paper execution. Env flag alone is never sufficient.

schema_version = "integrated_paper_shadow_productive_authorization_issuance_and_real_network_execution.v1"
producer_family = "ops.integrated_paper_shadow_productive_authorization_issuance_and_real_network_execution_v1"
