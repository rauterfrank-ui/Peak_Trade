consecutive_stale_budget = 3
max_reconnect_attempts = 10
max_reconnect_window_seconds = 120
per_request_max_retries = 2
session_http_429_budget = 20
min_quality_window_seconds = 300

network_scope = "okx_eea_futures_public_md_observe_v1"
session_execution_scope = "paper_shadow_observation_wallclock_v1"

decision_economics_bridge_enabled = true
decision_economics_bridge_capability = "WALLCLOCK_FULL_CANONICAL_DECISION_TO_SIMULATED_ECONOMICS_RUNTIME_BRIDGE_V1"
decision_economics_bridge_owner = "ops.wallclock_full_canonical_decision_to_simulated_economics_runtime_bridge_v1"

orders_authorized = false
testnet_authorized = false
live_authorized = false
auto_promotion_authorized = false
credentials_authorized = false
paper_execution_authorized = false
economic_validity_pass = false
promotion_pass = false

evidence_schema = "ops.integrated_paper_shadow_observation_wallclock_evidence_v1"
contract_doc = "docs/ops/runbooks/INTEGRATED_PAPER_SHADOW_OBSERVATION_WALLCLOCK_SESSION_EXECUTION_CAPABILITY_V1.md"
