# Integrated Paper-Shadow Observation Wallclock Session Execution Capability v1
#
# Technical capability only. Repository defaults do not authorize a productive
# session. No real network in CI. No Orders/Testnet/Live/Paper execution.

schema_version = "integrated_paper_shadow_observation_wallclock_session_execution.v1"
producer_family = "ops.integrated_paper_shadow_observation_wallclock_session_execution_v1"
capability_id = "INTEGRATED_PAPER_SHADOW_OBSERVATION_WALLCLOCK_SESSION_EXECUTION_CAPABILITY_V1"
authority_effect = "NONE"
activation_effect = "NONE"
runtime_effect = "NONE"
order_effect = "NONE"
economic_gate_effect = "NONE"

venue = "OKX"
market_type = "FUTURES"
host = "eea.okx.com"
transport = "rest_poll_v1"
instrument_allowlist = ["ETH-USD_UM_XPERP-310404"]
btc_forbidden = true
spot_forbidden = true

max_session_duration_seconds = 21600
poll_interval_seconds = 2.0
heartbeat_interval_seconds = 5.0
heartbeat_loss_seconds = 15.0
max_stale_seconds = 5.0
max_gap_seconds = 10.0
max_clock_skew_seconds = 30.0
