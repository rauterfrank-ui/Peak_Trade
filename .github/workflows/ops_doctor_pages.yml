name: Ops Doctor Dashboard (Pages)

on:
  workflow_dispatch: {}
  # Scheduled cron removed (cost minimization); manual dispatch only.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies (best-effort)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f uv.lock ]]; then
            uv sync --frozen
          elif [[ -f pyproject.toml ]]; then
            uv sync
          elif [[ -f requirements.txt ]]; then
            uv pip install -r requirements.txt
          else
            echo "No dependency manifest found; continuing."
          fi

      - name: Generate dashboard site (index.html + index.json)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          bash scripts/ops/generate_ops_doctor_dashboard.sh site/index.html

      - name: Upload run artifacts (HTML + JSON)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ops-doctor-dashboard
          path: |
            site/index.html
            site/index.json
          if-no-files-found: error
          retention-days: 14

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
