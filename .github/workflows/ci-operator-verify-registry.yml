name: CI / Operator Verify (Registry)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-verify:
    runs-on: ubuntu-latest
    # Observed successful Attempt 2 (run 32299845303) finished in ~5.5 minutes
    # including slow apt (Azure mirror Ign + archive.ubuntu.com fallback).
    # Bound the job well below the GitHub 360-minute default so a future
    # apt/pip stall cannot remain in_progress indefinitely.
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: |
          python -V
          python -m pip -V
          python -m pip install -U pip
          python -m pip install ruff==0.15.22

      - name: Ensure ripgrep
        # Attempt 2: apt-get update + install took ~5m10s after pip/ruff
        # succeeded in ~5s. 10 minutes is ~2x that observed apt success path
        # and still fail-closed versus the previous unbounded stall.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            echo "rg already present; skipping apt"
            command -v rg
            rg --version
            exit 0
          fi
          echo "rg not found; installing ripgrep via apt"
          sudo apt-get update
          sudo apt-get install -y ripgrep
          command -v rg
          rg --version

      - name: Ruff check (fast)
        run: |
          ruff check .

      - name: gh auth (token)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status

      - name: Operator verify (download + invariants)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # pull_request: proven historical artifact expiry is lifecycle hygiene,
          # not a product/verification regression. workflow_dispatch stays strict.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/ops/verify_from_registry.sh docs/ops/registry/LATEST_PHASE_M_SMOKE.pointer --download --allow-expired
          else
            scripts/ops/verify_from_registry.sh docs/ops/registry/LATEST_PHASE_M_SMOKE.pointer --download
          fi
