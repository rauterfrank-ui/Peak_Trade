name: Map Currency Gate

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]
  merge_group:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-currency-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  map-currency-gate:
    name: map-currency-gate
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate canonical frozen map and policy views
        run: |
          set -euo pipefail
          python3 scripts/ops/validate_system_atlas_v1.py
