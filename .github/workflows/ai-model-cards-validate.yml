name: ai-model-cards-validate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (minimal)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
      - name: Validate AI model cards
        run: |
          if [ ! -f src/ops/p51/ai_model_cards_validate_v1.py ]; then
            echo "p51 validator absent after KEEP29 external separation; no-op."
            exit 0
          fi
          python -m src.ops.p51.ai_model_cards_validate_v1 --paths docs/ai/model_cards
