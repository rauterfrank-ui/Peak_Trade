name: CI / Scheduled Paper Smoke

"on":
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: scheduled-paper-export-smoke
  cancel-in-progress: true

jobs:
  paper_tests_audit_evidence:
    if: vars.PT_SCHEDULED_PAPER_TESTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Paper guardrails
        shell: bash
        env:
          PT_SCHEDULED_PAPER_TESTS_ENABLED: ${{ vars.PT_SCHEDULED_PAPER_TESTS_ENABLED }}
        run: |
          bash scripts/ci/scheduled_guardrails.sh
      - name: Trigger paper-tests-audit-evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run "paper-tests-audit-evidence" -f scope=execution -f note="paper smoke"
