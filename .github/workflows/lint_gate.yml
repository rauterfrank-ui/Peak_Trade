name: Lint Gate (Always Run)

# Gate Pattern: This workflow ALWAYS runs (no paths filter in trigger)
# to ensure a check-run is created for Branch Protection.
# Internally, it checks if Python files changed.
# If not applicable → success (exit 0)
# If applicable → run linter (ruff)

on:
  workflow_dispatch: {}

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  lint-gate:
    name: Lint Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base tooling for Ready reuse verifier
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Exact-head Ready reuse
        id: reuse
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/exact_head_ready_reuse.py \
            --repo "${{ github.repository }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --contexts "Lint Gate" \
            --required-config config/ci/required_status_checks.json \
            --report-json out/ci/exact_head_ready_reuse_lint.json \
            --write-github-output

      - name: Exact-head Ready reuse short-circuit
        if: ${{ steps.reuse.outputs.reuse == 'true' }}
        run: |
          echo "REUSE_OK: Lint Gate — exact-head required context already success"

      - name: Checkout code
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Need full history for diff

      - name: Fetch base ref (for diff)
        if: ${{ steps.reuse.outputs.reuse != 'true' && github.event_name == 'pull_request' }}
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Formatter policy drift guard (no black enforcement)
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        run: |
          set -euo pipefail
          echo "🛡️  Checking formatter policy (no black enforcement)..."
          bash scripts/ops/check_no_black_enforcement.sh

      - name: Detect Python file changes
        id: detect
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        run: |
          set -euo pipefail

          # Determine base and head refs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE_SHA="${{ github.event.merge_group.base_sha }}"
            HEAD_SHA="${{ github.event.merge_group.head_sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch origin main --depth=1 || git fetch origin main
            BASE_SHA="$(git rev-parse origin/main)"
            HEAD_SHA="${{ github.sha }}"
          else
            echo "Unsupported event: ${{ github.event_name }}"
            exit 1
          fi

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          # Get changed Python files (ignore diff errors so we don't fail on bad revision)
          CHANGED_PY_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null | grep '\.py$' || true)

          if [ -n "$CHANGED_PY_FILES" ]; then
            echo "Python files changed:"
            echo "$CHANGED_PY_FILES"
            echo "applicable=true" >> $GITHUB_OUTPUT
            echo "changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_PY_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          # No changed py files: if base ref missing (e.g. fetch failed), run full check
          if ! git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
            echo "Warning: base ref not available, running full ruff check"
            echo "applicable=true" >> $GITHUB_OUTPUT
            echo "changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "No Python files changed"
          echo "applicable=false" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.detect.outputs.applicable == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.detect.outputs.applicable == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.22

      - name: Run ruff check
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.detect.outputs.applicable == 'true' }}
        run: |
          set -euo pipefail

          echo "Running ruff on changed Python files..."

          # Run ruff on all Python code (repository-wide for consistency)
          # Alternative: Only check changed files with --files option
          ruff check src/ tests/ scripts/ || {
            echo "❌ Ruff found linting issues"
            exit 1
          }

          echo "✅ Ruff check passed"

      - name: Run ruff format check
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.detect.outputs.applicable == 'true' }}
        run: |
          set -euo pipefail

          echo "Checking code formatting with ruff..."

          ruff format --check src/ tests/ scripts/ || {
            echo "❌ Code formatting issues found"
            echo "Run 'ruff format src/ tests/ scripts/' locally to fix"
            exit 1
          }

          echo "✅ Code formatting check passed"

      - name: Economic diagnostic optimization boundary guard v0
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        run: |
          set -euo pipefail
          echo "🛡️  Checking economic/diagnostic optimization boundary guard..."
          python scripts/ops/check_economic_diagnostic_optimization_boundary_guard_v0.py --base origin/main

      - name: Governance AI matrix consistency gate
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        run: |
          bash scripts/governance/ai_matrix_consistency_gate.sh

      - name: Gate Success (Not Applicable)
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.detect.outputs.applicable == 'false' }}
        run: |
          echo "✅ Lint Gate: Not applicable (no Python files changed)"
          exit 0
