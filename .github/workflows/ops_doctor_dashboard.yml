name: Ops Doctor Dashboard

on:
  workflow_dispatch: {}
  # Scheduled cron removed (cost minimization); manual dispatch only.

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Generate ops doctor dashboard (HTML + JSON)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ops/generate_ops_doctor_dashboard.sh

      - name: Upload dashboard artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ops-doctor-dashboard
          path: |
            reports/ops/ops_doctor_dashboard.html
            reports/ops/ops_doctor_dashboard.json
          if-no-files-found: error
          retention-days: 14
