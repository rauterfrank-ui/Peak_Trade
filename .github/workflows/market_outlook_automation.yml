name: MarketSentinel – Daily Market Outlook (retired)

# The v0 producer was removed in PR #6579. Keep the workflow identity for
# historical runs. A dispatch after an accidental re-enable fails explicitly.
on:
  workflow_dispatch:

permissions: {}

jobs:
  market_outlook_daily:
    runs-on: ubuntu-latest
    steps:
      - name: Report retirement
        run: |
          echo "::error::MarketSentinel v0 was retired; no market outlook was generated."
          exit 1
