# ============================================================================
# MarketSentinel – Daily Market Outlook Automation
# ============================================================================
# Automatische tägliche Marktprognose mit LLM-Integration
# Stand: Dezember 2024
# ============================================================================

name: MarketSentinel – Daily Market Outlook

on:
  # Scheduled cron removed (cost minimization); manual dispatch only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market_outlook_daily:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      # Muss in GitHub unter Settings → Secrets → Actions hinterlegt sein
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Falls du eine requirements.txt hast
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Optional: falls du ein Package via pyproject.toml hast
          if [ -f pyproject.toml ]; then
            pip install .
          fi

      - name: Run MarketSentinel v0 – Daily Market Outlook
        run: |
          mkdir -p reports/market_outlook
          # Scheduled runs: degrade to placeholder (--skip-llm) so cron does not require
          # PT_AI_* gates / policy chain for outbound LLM. Manual dispatch unchanged.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice title=MarketSentinel::Scheduled run uses --skip-llm (placeholder report)."
            python scripts/generate_market_outlook_daily.py \
              --config-path config/market_outlook/daily_market_outlook.yaml \
              --out-dir reports/market_outlook/ \
              --skip-llm
          else
            python scripts/generate_market_outlook_daily.py \
              --config-path config/market_outlook/daily_market_outlook.yaml \
              --out-dir reports/market_outlook/
          fi

      - name: Upload daily market outlook reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-outlook-daily
          path: reports/market_outlook
