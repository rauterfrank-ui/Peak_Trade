name: Docs Token Policy Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  docs_token_policy_gate:
    name: docs-token-policy-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base tooling for Ready reuse verifier
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Exact-head Ready reuse
        id: reuse
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/exact_head_ready_reuse.py \
            --repo "${{ github.repository }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --contexts "docs-token-policy-gate" \
            --required-config config/ci/required_status_checks.json \
            --report-json out/ci/exact_head_ready_reuse_docs_token.json \
            --write-github-output

      - name: Exact-head Ready reuse short-circuit
        if: ${{ steps.reuse.outputs.reuse == 'true' }}
        run: |
          echo "REUSE_OK: docs-token-policy-gate — exact-head required context already success"

      - name: Checkout
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch origin
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        run: git fetch --prune origin

      - name: Fetch base ref (ensure origin/main exists for merge-base)
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "${base_ref}:refs/remotes/origin/${base_ref}" || true

      - name: Determine base ref
        id: base
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            echo "base_ref=origin/${GITHUB_BASE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "base_ref=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if markdown files changed
        id: check_changes
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.base.outputs.base_ref }}"
          changed="$(git diff --name-only "${base}...HEAD" -- '*.md' || true)"
          if [[ -z "${changed}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Docs Token Policy Gate: not applicable (no markdown changes)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Markdown files changed:"
            echo "${changed}"
          fi

      - name: Set up Python
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.check_changes.outputs.changed == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate docs token policy
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.check_changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.base.outputs.base_ref }}"
          python scripts/ops/validate_docs_token_policy.py \
            --base "${base}" \
            --json docs-token-policy-report.json

      - name: Upload report artifact
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.check_changes.outputs.changed == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-token-policy-report
          path: docs-token-policy-report.json
          if-no-files-found: ignore
          retention-days: 30
