name: N1 V2 BREV Source Admission

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  n1-v2-brev-admission:
    name: n1-v2-brev-admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the candidate and target Git trees
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision the checker interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify source admission against the target commit
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          EVENT_CANDIDATE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVENT_BASE" =~ ^[0-9a-f]{40}$ && "$EVENT_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$EVENT_BASE^{commit}"
          git cat-file -e "$EVENT_CANDIDATE^{commit}"
          checker=scripts/ci/check_n1_v2_brev_admission.py
          trusted_checker="$RUNNER_TEMP/n1_v2_brev_admission.py"
          set --
          if git cat-file -e "$EVENT_BASE:$checker" 2>/dev/null; then
            git show "$EVENT_BASE:$checker" > "$trusted_checker"
          else
            # The governance-only bootstrap is reviewed before enabling enforcement.
            git show "$EVENT_CANDIDATE:$checker" > "$trusted_checker"
            set -- --bootstrap
          fi
          "$pythonLocation/bin/python" -I "$trusted_checker" \
            --base "$EVENT_BASE" --candidate "$EVENT_CANDIDATE" "$@"
