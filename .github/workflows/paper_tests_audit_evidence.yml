name: paper-tests-audit-evidence

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Test scope: execution (default) or full (if available)"
        required: true
        default: "execution"
        type: choice
        options:
          - execution
          - full
      note:
        description: "Optional operator note (audit metadata)"
        required: false
        default: ""
  # optional weekly schedule (disabled by default; uncomment if desired)
  # schedule:
  #   - cron: "0 4 * * 1"

concurrency:
  group: pt-paper-tests-audit-evidence
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paper_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Hard safety: never live/testnet from this workflow
      PEAK_TRADE_TESTNET_ONLY: "false"
      PEAK_TRADE_LIVE_ENABLED: "false"
      PEAK_TRADE_LIVE_ARMED: "false"
      PT_DRY_RUN: "1"
      EVI_DIR: "out/ops/gh_paper_tests_audit/${{ github.run_id }}_${{ github.run_attempt }}_py${{ matrix.python-version }}"

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Paper guardrails
        shell: bash
        env:
          PT_SCHEDULED_PAPER_TESTS_ENABLED: ${{ vars.PT_SCHEDULED_PAPER_TESTS_ENABLED }}
        run: |
          bash scripts/ci/scheduled_guardrails.sh
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Paper Tests + Audit Evidence (offline)
        env:
          AUDIT_SCOPE: ${{ github.event.inputs.scope }}
          AUDIT_NOTE: ${{ github.event.inputs.note }}
        run: |
          set -euo pipefail

          EVI_DIR="${EVI_DIR}"
          mkdir -p "${EVI_DIR}"

          # --- audit metadata (run params) ---
          {
            echo "ts_utc=$(date -u +%Y%m%dT%H%M%SZ)"
            echo "workflow=${{ github.workflow }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "job=${{ github.job }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "actor=${{ github.actor }}"
            printf 'scope=%s\n' "$AUDIT_SCOPE"
            printf 'note=%s\n' "$AUDIT_NOTE"
            echo "safety.PEAK_TRADE_LIVE_ENABLED=${PEAK_TRADE_LIVE_ENABLED}"
            echo "safety.PEAK_TRADE_LIVE_ARMED=${PEAK_TRADE_LIVE_ARMED}"
            echo "safety.PT_DRY_RUN=${PT_DRY_RUN}"
          } | tee "${EVI_DIR}/run_params.txt"

          python -V | tee "${EVI_DIR}/python_version.txt"

          # --- test run (scope) ---
          if [ "$AUDIT_SCOPE" = "full" ]; then
            python -m pytest -q | tee "${EVI_DIR}/pytest_full.txt"
          else
            python -m pytest -q tests/execution | tee "${EVI_DIR}/pytest_execution.txt"
          fi

          # --- runner_v1 import smoke (does not fail job) ---
          if [ -f src/execution/session/runner_v1.py ]; then
            python -c "import importlib; importlib.import_module('src.execution.session.runner_v1'); print('OK: runner_v1 import')" \
              | tee "${EVI_DIR}/runner_v1_import.txt" || true
          else
            echo "SKIP: src/execution/session/runner_v1.py not found" | tee "${EVI_DIR}/runner_v1_import.txt"
          fi

          # --- produce evidence_manifest (paper session, deterministic, Phase L) ---
          PT_EVIDENCE_INCLUDE_DECISION=1 python3 scripts/aiops/run_paper_trading_session.py \
            --spec "tests/fixtures/p7/paper_run_min_v0.json" \
            --run-id "ci_smoke" \
            --outdir "${EVI_DIR}/session_out" \
            --evidence 1
          test -f "${EVI_DIR}/session_out/evidence_manifest.json"

          # --- policy telemetry summary (Phase L: real policy from evidence_manifest) ---
          python3 scripts/aiops/extract_policy_telemetry_summary.py \
            --manifest "${EVI_DIR}/session_out/evidence_manifest.json" \
            --out "${EVI_DIR}/telemetry_summary.json"
          python3 -c '
          import json
          d=json.load(open("'"${EVI_DIR}"'/telemetry_summary.json","r",encoding="utf-8"))
          assert isinstance(d,dict)
          pol=d.get("policy") or {}
          assert isinstance(pol,dict) and pol, "policy must be non-empty"
          assert pol.get("action") in ("ALLOW","NO_TRADE"), "missing/invalid policy.action"
          rc=pol.get("reason_codes",[])
          assert isinstance(rc,list), "reason_codes must be list"
          assert "AUDIT_MANIFEST_NO_DECISION_CONTEXT" not in rc, "policy must be real, not fallback"
          print("policy_action=",pol.get("action"),"reason_codes_n=",len(rc))
          '
          # Index the final files, including telemetry, before publishing the bundle.
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          evi_dir = Path(os.environ["EVI_DIR"])
          items = []
          for p in sorted(evi_dir.rglob("*")):
              if p.is_file() and p not in (evi_dir / "manifest.json", evi_dir / "SHA256SUMS.txt"):
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  items.append({"path": str(p.relative_to(evi_dir)), "sha256": h, "bytes": p.stat().st_size})
          manifest = {"schema": "pt.audit.evidence.manifest.v1", "evidence_dir": str(evi_dir), "n_items": len(items), "items": items}
          (evi_dir / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8")
          (evi_dir / "SHA256SUMS.txt").write_text("\n".join([f'{it["sha256"]}  {it["path"]}' for it in items]) + "\n", encoding="utf-8")
          print("MANIFEST_OK", len(items))
          PY

      - name: Verify Paper audit evidence checksums
        run: |
          set -euo pipefail
          cd "$EVI_DIR"
          test -s manifest.json
          test -s SHA256SUMS.txt
          sha256sum --strict --check SHA256SUMS.txt

      - name: Upload artifact (audit evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gh-paper-tests-audit-evidence-py${{ matrix.python-version }}
          path: |
            out/ops/gh_paper_tests_audit/**
